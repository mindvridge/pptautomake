analysis:
  min_diagram_area_ratio: 0.25    # 이미지를 도식으로 판별하는 최소 슬라이드 면적 비율
  vision_backend: local            # local (서버 불필요) / ollama / anthropic
  local_model: vikhyatk/moondream2 # local 백엔드 모델 (HuggingFace 모델 ID)
  vision_model: claude-sonnet-4-20250514  # Anthropic 사용 시 모델명
  ollama_model: llama3.2-vision    # Ollama 사용 시 비전 모델명
  ollama_base_url: http://localhost:11434  # Ollama 서버 주소
  max_concurrent_api_calls: 3     # 최대 동시 API 호출 수
  api_timeout: 120                # Vision API 타임아웃 (초)
  max_retries: 3                  # API 호출 실패 시 재시도 횟수

builder:
  slide_width_inches: 13.333      # 와이드스크린
  slide_height_inches: 7.5
  margin_inches: 0.5
  default_colors:
    primary: "#2D6A4F"
    secondary: "#40916C"
    accent: "#95D5B2"
    background: "#F0F0F0"
    text: "#333333"
  default_fonts:
    title: "맑은 고딕"
    body: "맑은 고딕"
    title_size_pt: 24
    body_size_pt: 12

output:
  insert_mode: after_original     # after_original / append_end / replace
  keep_original: true             # 원본 슬라이드 유지 여부
  output_suffix: "_rebuilt"       # 출력 파일 접미사
